name: Build DeviceSpoof deb

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'DeviceSpoof/**'
      - '.github/workflows/build-devicespoof-deb.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot rsync curl perl zip git libxml2 libtinfo6 xz-utils dpkg-dev libplist-utils
          # Theos plistutil is linked against libplist-2.0.so.4
          sudo apt-get install -y libplist-2.0-4 || true
          ldconfig -p | grep libplist || true
          if ! ldconfig -p | grep -q 'libplist-2.0.so.4'; then
            echo "libplist-2.0.so.4 is still missing"
            apt-cache search libplist
            exit 1
          fi

      - name: Install Theos and iOS toolchain
        run: |
          set -euo pipefail
          export THEOS="$HOME/theos"
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/toolchain" "$THEOS/sdks"
          ARCH="$(uname -m)"
          curl -fsSL "https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-${ARCH}.tar.xz" \
            | tar -xJ -C "$THEOS/toolchain"
          test -x "$THEOS/toolchain/linux/iphone/bin/clang"
          curl -fsSL -o "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz" \
            https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz
          tar -xJf "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz" -C "$THEOS/sdks"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$THEOS/toolchain/linux/iphone/bin" >> "$GITHUB_PATH"

      - name: Build deb
        working-directory: DeviceSpoof
        run: |
          set +e
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless > "$RUNNER_TEMP/devicespoof-build.log" 2>&1
          code=$?
          cat "$RUNNER_TEMP/devicespoof-build.log"
          if [ "$code" -ne 0 ]; then
            tail -n 25 "$RUNNER_TEMP/devicespoof-build.log" | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit "$code"
          fi

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: DeviceSpoof-deb
          path: DeviceSpoof/packages/*.deb
          if-no-files-found: error
